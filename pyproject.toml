[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-reforge"
version = "0.1.0"
description = "Generate deformed variants of MITRE atomic-red-team tests to evaluate EDR detection coverage"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.18",
    "typer>=0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atomic-reforge = "atomic_reforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
